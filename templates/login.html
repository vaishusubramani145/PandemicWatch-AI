<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANDEMICWATCH AI &mdash; Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .auth-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cfd6e6;
    }
    .form-input {
      width: 100%;
      background: rgba(10, 14, 26, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(62, 226, 192, 0.2);
    }
    .btn-login {
      width: 100%;
      background: var(--grad);
      color: #06121a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 24px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .btn-login:hover { transform: translateY(-1px); }
    .forgot-pw {
      color: var(--muted);
      font-size: 13px;
      display: inline-block;
      cursor: pointer;
    }
    .forgot-pw:hover { color: var(--accent); text-decoration: underline; }
    .demo-strip {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .demo-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      display: block;
      width: 100%;
      text-align: left;
    }
    .alert-msg {
      background: rgba(255, 92, 124, 0.15);
      border: 1px solid rgba(255, 92, 124, 0.3);
      color: #ff859d;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <!-- Exact User Wireframe -->
    <div class="auth-title">PANDEMICWATCH AI</div>
    <div class="auth-subtitle">AI-Based Outbreak Intelligence</div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert-msg">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="officer@pandemicwatch.in" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">[ &nbsp; LOGIN &nbsp; ]</button>

      <div>
        <a class="forgot-pw" onclick="alert('Demo Credentials:\n\n• Officer: officer@pandemicwatch.in / officer123\n• Analyst: analyst@pandemicwatch.in / analyst123\n• Researcher: researcher@pandemicwatch.in / research123')">Forgot Password?</a>
      </div>
    </form>

    <!-- Quick Fill for Demo -->
    <div class="demo-strip">
      <span>Quick Demo Login:</span>
      <button class="demo-btn" onclick="fillForm('officer@pandemicwatch.in', 'officer123')">
        👨‍⚕️ Dr. A. Varma (Health Officer) &rarr;
      </button>
      <button class="demo-btn" onclick="fillForm('analyst@pandemicwatch.in', 'analyst123')">
        📊 Priya Sharma (Surveillance Analyst) &rarr;
      </button>
    </div>

    <div style="margin-top: 18px; font-size: 12px; color: var(--muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--accent);">Sign Up</a> &middot;
      <a href="{{ url_for('dashboard') }}" style="color:var(--muted);">Guest Access</a>
    </div>
  </div>

  <script>
    function fillForm(e, p) {
      document.getElementById('email').value = e;
      document.getElementById('password').value = p;
      document.getElementById('loginForm').submit();
    }
  </script>
</body>
</html>
